name: Live Cloudflare staging smoke

on:
  push:
    branches: [main, feature/cloudflare-docx-compat, feature/employee-policy-rates-docx-layout, feature/prefilled-editable-employee-directory]
    paths:
      - 'cloudflare-app/**'
      - '.github/workflows/cloudflare-live-smoke.yml'
  pull_request:
    paths: ['cloudflare-app/**', '.github/workflows/cloudflare-live-smoke.yml']
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check HTTPS and application health
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --retry-delay 4 --max-time 20 -fsS https://dsa-a2i.19122918.xyz/health -o health.json
          cat health.json
          python -c 'import json; d=json.load(open("health.json")); assert d["application"]=="dsa-automation" and d["status"]=="ok" and d["databaseConfigured"]'
      - name: Confirm HTML interface responds
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --max-time 20 -fsS https://dsa-a2i.19122918.xyz/ -o app.html
          grep -q 'DSA Automation' app.html
          grep -q 'Generate DOCX ZIP' app.html
          grep -q 'name="office_name"' app.html
          grep -q 'name="dsa_band"' app.html
          grep -q 'name="travel_band"' app.html
          grep -q 'name="dsa_area"' app.html
          grep -q 'Air travel' app.html
          grep -q 'id="employeeEditor"' app.html
          grep -q 'data-edit-employee' app.html
          grep -q 'seed_initial_employee_directory' app.html
          grep -q 'Continue with Google' app.html
          grep -q 'https://ibas.finance.gov.bd/Public/DistanceMatrix' app.html
          grep -q 'datalist id="bdDistricts"' app.html
          grep -q "list:'bdDistricts'" app.html
          grep -q 'employee-hierarchy' app.html
          grep -q 'approved_full_days??1' app.html
          grep -q 'id="employeeSearch"' app.html
          grep -q 'id="employeeCategory"' app.html
          grep -q 'id="travelerSearch"' app.html
          grep -q 'id="claimPreview"' app.html
          grep -q 'Travel claims, made simpler.' app.html
          grep -q 'class="process"' app.html
          grep -q 'class="hero"' app.html
          grep -q 'function duplicateTrip(id)' app.html
          grep -q 'function updateClaimPreview()' app.html
          grep -q 'class="leg-method"' app.html
          grep -q 'name="leg_mode"' app.html
          grep -q 'leg_modes:p.legModes' app.html
          grep -q 'isActiveTrip' app.html
          if grep -q 'distanceVerified' app.html; then echo 'Old mandatory distance confirmation still present'; exit 1; fi
          if grep -q 'Rate / KM BDT' app.html; then echo 'Manual travel rate field still present'; exit 1; fi
          grep -q 'iBAS-verified distance (km)' app.html
      - name: Document generation rejects unauthenticated requests
        shell: bash
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" -H "Content-Type: application/json" -d '{"trip":{"title":"test","purpose":"test","legs":[{}]},"travelers":[{}]}' https://dsa-a2i.19122918.xyz/api/generate)
          test "$status" = "400" || test "$status" = "401"
      - name: Public DOCX diagnostic route is disabled
        shell: bash
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" https://dsa-a2i.19122918.xyz/internal/docx-smoke)
          test "$status" = "404"
      - name: Check Google provider status (informational)
        shell: bash
        run: |
          curl -fsS https://dsa-a2i.19122918.xyz/config -o config.json
          python - <<'PY'
          import json, urllib.request
          c=json.load(open('config.json'))
          req=urllib.request.Request(c['supabaseUrl']+'/auth/v1/settings',headers={'apikey':c['supabaseKey']})
          try:
              with urllib.request.urlopen(req,timeout=15) as response:
                  settings=json.load(response)
              print('GOOGLE_PROVIDER_ENABLED=' + str(settings.get('external',{}).get('google',False)).lower())
          except Exception as e:
              print('GOOGLE_PROVIDER_STATUS_UNAVAILABLE='+type(e).__name__)
          PY
      - name: Initial employee import requires sign-in
        shell: bash
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H 'Content-Type: application/json' \
            -X POST -d '{}' \
            https://umwzdtwmholgnqzzqmab.supabase.co/rest/v1/rpc/seed_initial_employee_directory)
          test "$status" = "401" || test "$status" = "403"
